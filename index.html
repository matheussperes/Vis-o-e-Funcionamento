<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#23262E">
  <meta name="description" content="Visão e Funcionamento — cockpit pessoal de áreas, projetos e tarefas.">
  <title>Visão e Funcionamento</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="nav" class="nav hidden" aria-label="Navegação principal">
      <div class="nav-brand" aria-hidden="true">VF<span class="nav-brand-sub">Visão e Funcionamento</span></div>

      <span class="nav-grupo so-desktop" aria-hidden="true">Visão</span>
      <button class="nav-item so-desktop" data-rota="#/visao" data-pref="visao">Visão Geral</button>
      <button class="nav-item" data-rota="#/agora" data-pref="agora">Agora</button>
      <button class="nav-item" data-rota="#/hoje" data-pref="hoje">Hoje</button>
      <button class="nav-item" data-rota="#/semana" data-pref="semana">Semana</button>

      <span class="nav-grupo so-desktop" aria-hidden="true">Gerenciar</span>
      <button class="nav-item so-desktop" data-rota="#/areas" data-pref="areas">Áreas</button>
      <button class="nav-item so-desktop" data-rota="#/panorama" data-pref="projetos">Projetos</button>
      <button class="nav-item so-mobile" data-rota="#/panorama">Panorama</button>
      <button class="nav-item so-desktop" data-rota="#/metas" data-pref="metas">Metas</button>
      <button class="nav-item so-desktop" data-rota="#/templates" data-pref="templates">Templates</button>

      <span class="nav-grupo so-desktop" aria-hidden="true">Relatórios</span>
      <button class="nav-item so-desktop" data-rota="#/relatorio" data-pref="relatorio">Relatório semanal</button>

      <span class="nav-grupo so-desktop" aria-hidden="true" data-pref="navAreas">Áreas da vida</span>
      <div id="nav-areas" class="nav-areas so-desktop" data-pref="navAreas"></div>

      <div class="nav-espaco so-desktop" aria-hidden="true"></div>

      <div id="nav-meta" class="nav-meta so-desktop hidden" data-pref="metaCard"></div>

      <span class="nav-grupo so-desktop" aria-hidden="true">Configurações</span>
      <button class="nav-item so-desktop" data-rota="#/preferencias">Preferências</button>

      <button class="nav-item so-desktop nav-sair" data-sair>Sair</button>
      <button class="nav-item so-mobile" id="btn-mais" aria-haspopup="true" aria-expanded="false">Mais</button>
    </aside>

    <div id="mais-menu" class="mais-menu hidden" role="menu" aria-label="Mais opções">
      <button class="mais-item" role="menuitem" data-rota="#/visao">Visão Geral</button>
      <button class="mais-item" role="menuitem" data-rota="#/metas">Metas</button>
      <button class="mais-item" role="menuitem" data-rota="#/templates">Templates</button>
      <button class="mais-item" role="menuitem" data-rota="#/relatorio">Relatório</button>
      <button class="mais-item" role="menuitem" data-rota="#/preferencias">Preferências</button>
      <button class="mais-item" role="menuitem" data-sair>Sair</button>
    </div>

    <main id="view" class="view" tabindex="-1"></main>

    <button id="btn-mais-rapida" class="fab hidden" aria-label="Criação rápida de tarefa">+</button>
    <div id="modal-raiz" class="hidden"></div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
